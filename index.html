(function () {
  var wide = window.matchMedia('(min-width: 900px)');
  var forced = new URLSearchParams(window.location.search).get('view');
  function route() {
    var target = forced === 'mobile' ? 'mobile.html' :
      forced === 'desktop' ? 'desktop.html' :
      wide.matches ? 'desktop.html' : 'mobile.html';
    var current = window.location.pathname.split('/').pop() || 'index.html';
    if (current !== target) {
      window.location.replace(target + window.location.search + window.location.hash);
    }
  }
  route();
  if (wide.addEventListener) wide.addEventListener('change', route);
  else wide.addListener(route);
})();
</script>
